    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        function isExtensionError(filename, error) {
          var src = typeof filename === 'string' ? filename : '';
          var stack = error && typeof error.stack === 'string' ? error.stack : '';
          return (
            src.indexOf('chrome-extension://') === 0 ||
            src.indexOf('moz-extension://') === 0 ||
            src.indexOf('safari-extension://') === 0 ||
            stack.indexOf('chrome-extension://') !== -1 ||
            stack.indexOf('moz-extension://') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (event) {
            if (isExtensionError(event.filename, event.error)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            if (isExtensionError('', event.reason)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
